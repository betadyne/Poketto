[package]
name = "poketto"
version = "0.1.0-beta"
description = "Visual Novel Game Launcher"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "poketto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.6"
tauri-plugin-fs = "2.4.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
redb = "2"
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"
tauri-plugin-shell = "2.3.3"
parking_lot = "0.12"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3.1"
discord-rich-presence = { git = "https://github.com/vionya/discord-rich-presence", rev = "cf51648ef0745da8c56d5da9a5e9d64135a1735c" }
thiserror = "2"
