[workspace]
resolver = "2"
members = ["crates/poketto-core", "crates/poketto-app"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.17.1"
slint-build = "1.17.1"
thiserror = "2.0.20"
